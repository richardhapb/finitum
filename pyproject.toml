[project]
version = "0.0.1"
name = "fin-make"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.116.1",
    "granian>=2.5.3",
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
pythonpath = "src"
python_files = ["test_*.py", "*_tests.py"]

